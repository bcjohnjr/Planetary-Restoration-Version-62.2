name: Planetary Restoration Model V62.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-v62-2:
    name: Run V62.2 comprehensive model
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify V62.2 overlay and inherited comprehensive model
        run: |
          test -f planetary_restoration_model_v62_2.py
          test -f planetary_restoration_model_v62.py
          test -f planetary_restoration_model_v59_1.py
          test -f v62_2_matched_validation.json
          test -f COMPLETE_MODULE_CHECKLIST_V62_2.md
          test -f requirements.txt
          echo "V62.2 comprehensive package structure verified."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check V62.2
        run: |
          python -m py_compile planetary_restoration_model_v62_2.py test_planetary_restoration_model_v62_2.py

      - name: Run V62.2 comprehensive tests
        run: |
          python planetary_restoration_model_v62_2.py --tests

      - name: Verify scope lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/v62_2_completeness_gate.json')
          obj = json.loads(p.read_text())
          assert obj['pass'] is True, obj
          assert obj['registry_count'] >= 89, obj
          print(obj)
          PY

      - name: Show generated results
        run: |
          echo "Generated V62.2 result files:"
          find results -maxdepth 2 -type f -name '*v62_2*' -print

      - name: Upload V62.2 results
        uses: actions/upload-artifact@v7
        with:
          name: Planetary-Restoration-V62.2-Results
          path: |
            results/*v62_2*
            results/planetary_restoration_v62_2_results.json
          if-no-files-found: error
